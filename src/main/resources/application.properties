spring.application.name=FileMaster

# Render gives us PORT at runtime; locally we fall back to 8080.
server.port=${PORT:8080}

# Upload limits. The multipart limit is a hard stop at the web layer;
# filemaster.max-file-size-mb is checked again in FileValidationService.
# 55 MB so audio/video (50 MB) fit; every feature checks its own, smaller limit again in code.
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=65MB
filemaster.max-file-size-mb=20
# Tomcat allows only 10 parts per upload (files + form fields), so keep this at 8 or less.
filemaster.max-files=8
filemaster.max-total-size-mb=60

# Never leak internal details in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Compress text responses (HTML/CSS/JS/JSON) to save bandwidth.
server.compression.enabled=true

# ---- Audio / video / WebP (FFmpeg) ----
# "ffmpeg" is found on the PATH. Docker installs it; on your own PC install it first (see README).
filemaster.ffmpeg-path=ffmpeg
filemaster.max-media-size-mb=50
# A conversion running longer than this is stopped.
filemaster.ffmpeg-timeout-seconds=240
# How many FFmpeg processes may run at once (small servers have little memory).
filemaster.ffmpeg-max-concurrent=1
# A result bigger than this is refused (for example a long MP3 turned into a huge WAV).
filemaster.ffmpeg-max-output-mb=100

# ---- Documents (LibreOffice) ----
# LibreOffice keeps pictures, logos, tables, fonts and non-English text when converting Word, PDF and text files.
# If it is not installed, documents are converted text-only and the user is told so.
# On a small server (under 1 GB of memory) set this to false, or set the environment variable FILEMASTER_OFFICE_ENABLED=false.
filemaster.office-enabled=true
filemaster.office-path=soffice
# A document conversion running longer than this is stopped.
filemaster.office-timeout-seconds=120
# LibreOffice needs about 200 MB of memory per conversion, so only one runs at a time by default.
filemaster.office-max-concurrent=1
